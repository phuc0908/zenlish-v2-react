<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOEIC ETS 2026 — Luyện đề</title>
    <meta name="description" content="Trang luyện đề TOEIC ETS 2026: thi thử có tính giờ, chấm điểm và xem giải thích." />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06182f" media="(prefers-color-scheme: dark)" />
    <script>
      // Runs before the first paint so a dark-mode reload never flashes white.
      // Must stay in sync with src/hooks/useTheme.ts.
      try {
        var stored = localStorage.getItem('ets:theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
